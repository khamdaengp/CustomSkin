<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CustomSkin</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="dark-theme">
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="../icons/icon-48.png" alt="CustomSkin" class="brand-icon">
        <span class="brand-name">CustomSkin</span>
      </div>
      <div class="header-actions">
        <button id="btn-open-options" class="icon-button" title="Manage all customized domains & paths" aria-label="Open Options">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Domain & Toggle Bar -->
    <section class="site-bar">
      <div class="domain-info" id="domain-info-box">
        <span class="globe-icon">🌐</span>
        <span id="current-domain" class="domain-name" title="Current Domain">Detecting site...</span>
      </div>
      <div class="toggle-control">
        <label class="switch" for="theme-toggle" title="Enable or disable style for this scope">
          <input type="checkbox" id="theme-toggle" checked>
          <span class="slider"></span>
        </label>
        <span id="toggle-label" class="toggle-text">Active</span>
      </div>
    </section>

    <!-- Target Scope Selector (Domain vs Path Prefix vs Exact URL) -->
    <section class="scope-bar" id="scope-bar">
      <div class="scope-header">
        <span class="scope-title">Apply Style To:</span>
        <span id="active-rules-badge" class="active-rules-badge" title="Number of matching styles active on this page">1 rule active</span>
      </div>
      <div class="scope-selector">
        <button type="button" class="scope-btn active" data-scope="domain" id="scope-btn-domain" title="Applies across this entire domain">
          🌐 Entire Site
        </button>
        <button type="button" class="scope-btn" data-scope="prefix" id="scope-btn-prefix" title="Applies to this path and all subpages">
          📁 Path Prefix
        </button>
        <button type="button" class="scope-btn" data-scope="exact" id="scope-btn-exact" title="Applies strictly to this exact page URL">
          🎯 Exact Page
        </button>
      </div>
      <div class="target-pattern-pill" id="target-pattern-pill" title="Target Pattern">
        <span class="pill-label">Target:</span>
        <span id="target-pattern-text" class="pill-text">example.com</span>
      </div>
    </section>

    <!-- Warning / Incompatible page notice -->
    <div id="restricted-notice" class="notice-box hidden">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span>Browser system pages cannot be styled with custom CSS.</span>
    </div>

    <!-- Main Editor Section -->
    <main class="editor-section" id="editor-section">
      <div class="editor-header">
        <span class="editor-title" id="editor-heading">CSS for this scope</span>
        <div class="editor-tools">
          <button id="btn-quick-template" class="btn-subtle" title="Insert Dark Mode template">
            + Quick Dark Theme
          </button>
        </div>
      </div>

      <!-- Enhanced Monospace / Highlight Editor Container -->
      <div class="editor-wrapper">
        <div class="line-numbers" id="line-numbers" aria-hidden="true">
          <span>1</span>
        </div>
        <div class="editor-content-area">
          <pre id="highlight-backdrop" class="highlight-backdrop" aria-hidden="true"><code id="highlight-code"></code></pre>
          <textarea id="css-textarea" class="css-textarea" placeholder="/* Enter custom CSS for this scope */&#10;body {&#10;  background-color: #121212 !important;&#10;  color: #e0e0e0 !important;&#10;}" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
        </div>
      </div>

      <div class="editor-footer">
        <span id="editor-stats" class="editor-stats">0 lines • 0 chars</span>
        <span class="hint">Tab to indent • Live preview on Apply</span>
      </div>
    </main>

    <!-- Footer Actions -->
    <footer class="popup-footer">
      <button id="btn-reset" class="btn-secondary" title="Clear CSS for the selected scope">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        Reset Scope
      </button>
      <button id="btn-apply" class="btn-primary" title="Apply and save CSS immediately">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Apply CSS
      </button>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="../shared/storage.js"></script>
  <script src="../shared/editor-highlighter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
